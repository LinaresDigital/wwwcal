# Publica en GitHub Pages (wwwcal.linaresdigital.com) la rama «desarrollo»
# de LinaresDigital/contenido, para probar el nuevo diseño.
#
# El repositorio "contenido" es privado: se clona con una deploy key de solo
# lectura cuya clave privada está en el secret CONTENIDO_DEPLOY_KEY.
#
# "contenido" guarda la web tal cual estaba en el hosting, incluido el código
# PHP (autobus, phpMyAdmin...). GitHub Pages solo sirve ficheros estáticos,
# así que antes de publicar se elimina todo lo relacionado con PHP.

name: Desplegar web

on:
  # Cambios en este propio workflow
  push:
    branches: [main]
  # Aviso desde "contenido" (gh api repos/LinaresDigital/wwwcal/dispatches)
  repository_dispatch:
    types: [contenido-actualizado]
  # Lanzamiento manual desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez, sin cancelar el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar contenido
        uses: actions/checkout@v7
        with:
          repository: LinaresDigital/contenido
          ref: desarrollo
          ssh-key: ${{ secrets.CONTENIDO_DEPLOY_KEY }}
          persist-credentials: false
          path: sitio

      - name: Eliminar código PHP
        working-directory: sitio
        run: |
          # Aplicaciones PHP y directorios del hosting
          rm -rf autobus cgi-bin
          find . -maxdepth 1 -type d -iname 'phpmyadmin*' -exec rm -rf {} +

          # Ficheros PHP sueltos, configuración de PHP/Apache y registros
          find . -type f -not -path './.git/*' \( \
              -iname '*.php' -o -iname '*.php[0-9]' -o -iname '*.phtml' \
              -o -iname '*.phar' -o -iname 'php.ini' -o -iname '.user.ini' \
              -o -iname '.htaccess' -o -iname 'error_log' \
            \) -print -delete

          # Ficheros de trabajo del nuevo diseño (no se publican)
          rm -rf Contenido.md herramientas

          # Directorios que hayan quedado vacíos
          find . -mindepth 1 -type d -empty -not -path './.git*' -print -delete

      - name: Comprobar que no queda PHP
        working-directory: sitio
        run: |
          restos=$(find . -not -path './.git/*' \( -iname '*.php*' -o -iname '*.phtml' -o -ipath '*phpmyadmin*' -o -path './autobus*' \) -print)
          if [ -n "$restos" ]; then
            echo "::error::Quedan ficheros relacionados con PHP:"
            echo "$restos"
            exit 1
          fi
          echo "Se publicará:"
          find . -not -path './.git/*' -type f | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
