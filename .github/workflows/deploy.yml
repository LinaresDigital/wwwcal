# Publica en GitHub Pages (wwwcal.linaresdigital.com) la rama «desarrollo»
# de LinaresDigital/contenido, para probar el nuevo diseño.
#
# El repositorio "contenido" es privado: se clona con una deploy key de solo
# lectura cuya clave privada está en el secret CONTENIDO_DEPLOY_KEY.
#
# Estructura de "contenido":
#   docs/          la web nueva: es lo único que se publica
#   legado/        la web antigua del hosting (PHP, phpMyAdmin...): no se publica
#   herramientas/  generadores de la web: no se publican
#   Contenido.md   fuente de los textos: no se publica
#
# GitHub Pages solo sirve ficheros estáticos, así que antes de publicar se
# comprueba que en docs/ no hay nada relacionado con PHP.

name: Desplegar web

on:
  # Cambios en este propio workflow
  push:
    branches: [main]
  # Aviso desde "contenido" (gh api repos/LinaresDigital/wwwcal/dispatches)
  repository_dispatch:
    types: [contenido-actualizado]
  # Lanzamiento manual desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez, sin cancelar el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar contenido
        uses: actions/checkout@v7
        with:
          repository: LinaresDigital/contenido
          ref: desarrollo
          ssh-key: ${{ secrets.CONTENIDO_DEPLOY_KEY }}
          persist-credentials: false
          path: sitio

      - name: Comprobar que no hay PHP en docs
        working-directory: sitio/docs
        run: |
          restos=$(find . \( -iname '*.php*' -o -iname '*.phtml' -o -iname '*.phar' \
              -o -iname '.htaccess' -o -iname '.user.ini' -o -iname 'error_log' \
              -o -ipath '*phpmyadmin*' \) -print)
          if [ -n "$restos" ]; then
            echo "::error::docs/ contiene ficheros relacionados con PHP:"
            echo "$restos"
            exit 1
          fi
          echo "Se publicará:"
          find . -type f | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
